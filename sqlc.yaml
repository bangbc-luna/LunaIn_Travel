version: "2"
sql:
  - engine: postgresql
    schema: internal/platform/db/migrations
    queries: internal/identity/queries.sql
    gen:
      go:
        package: store
        out: internal/identity/store
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
